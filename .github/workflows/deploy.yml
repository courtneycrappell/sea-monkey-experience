name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: findpianoworks/package-lock.json

      - name: Install Astro dependencies
        run: npm ci
        working-directory: findpianoworks

      - name: Build Astro site
        run: npm run build
        working-directory: findpianoworks

      # Assemble the full site:
      #   root static files  → deploy/
      #   Astro dist/        → deploy/findpianoworks/
      - name: Assemble deployment directory
        run: |
          mkdir -p deploy/findpianoworks
          # Copy all root-level static files except the Astro source folder
          rsync -a --exclude='findpianoworks' --exclude='.github' --exclude='.git' \
            ./ deploy/
          # Copy the Astro build output into the findpianoworks subfolder
          cp -r findpianoworks/dist/. deploy/findpianoworks/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
