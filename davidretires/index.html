<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>One Final Curtain</title>
  <style>
    :root {
      --wine:    #3a0d18;
      --wine-lo: #24070f;
      --gold:    #d4af6a;
      --gold-lo: #a9843f;
      --cream:   #f4e9d6;
      --muted:   #c9a9ac;
      --serif:   Georgia, "Times New Roman", "Playfair Display", serif;
      --sans:    system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--serif);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.25rem;
      /* spotlight glow over a deep theater-curtain wine */
      background:
        radial-gradient(ellipse 70% 55% at 50% 38%, rgba(212,175,106,0.16), transparent 70%),
        linear-gradient(160deg, var(--wine) 0%, var(--wine-lo) 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* faint stage-curtain drapes at the left and right edges */
    body::before, body::after {
      content: "";
      position: fixed;
      top: 0;
      bottom: 0;
      width: 12vw;
      max-width: 130px;
      pointer-events: none;
      opacity: 0.55;
      z-index: 0;
    }
    body::before {
      left: 0;
      background: repeating-linear-gradient(90deg,
        rgba(0,0,0,0.35) 0, rgba(0,0,0,0.35) 8px,
        rgba(120,20,40,0.28) 8px, rgba(120,20,40,0.28) 26px);
      -webkit-mask-image: linear-gradient(90deg, #000, transparent);
              mask-image: linear-gradient(90deg, #000, transparent);
    }
    body::after {
      right: 0;
      background: repeating-linear-gradient(90deg,
        rgba(120,20,40,0.28) 0, rgba(120,20,40,0.28) 18px,
        rgba(0,0,0,0.35) 18px, rgba(0,0,0,0.35) 26px);
      -webkit-mask-image: linear-gradient(270deg, #000, transparent);
              mask-image: linear-gradient(270deg, #000, transparent);
    }

    main { position: relative; z-index: 1; width: 100%; max-width: 760px; }

    .kicker {
      font-family: var(--sans);
      font-size: 0.8rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.1rem;
      padding-left: 0.42em; /* balance the trailing letter-spacing */
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 4.6rem);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: 0.01em;
      margin-bottom: 0.2rem;
    }
    h1 .slipper { font-size: 0.62em; vertical-align: 0.12em; }

    .rule {
      width: 72px;
      height: 2px;
      margin: 1.4rem auto 1.5rem;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .subhead {
      font-size: clamp(1.02rem, 2.6vw, 1.3rem);
      font-style: italic;
      color: var(--cream);
      opacity: 0.92;
      max-width: 30em;
      margin: 0 auto 2.6rem;
      line-height: 1.5;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(0.5rem, 2vw, 1.1rem);
      margin: 0 auto 2.4rem;
      max-width: 640px;
    }

    .unit {
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(212,175,106,0.38);
      border-radius: 12px;
      padding: 1.1rem 0.35rem 0.85rem;
      box-shadow: 0 6px 24px rgba(0,0,0,0.28), inset 0 0 30px rgba(212,175,106,0.05);
    }
    .num {
      font-size: clamp(1.9rem, 8vw, 3.5rem);
      font-weight: 700;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .label {
      font-family: var(--sans);
      font-size: clamp(0.58rem, 1.7vw, 0.72rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.6rem;
    }

    .closing {
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--gold);
      letter-spacing: 0.02em;
    }
    .closing .small {
      display: block;
      font-family: var(--sans);
      font-style: normal;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.7rem;
    }

    /* end-of-countdown "curtain call" state */
    .finale h1 { margin-bottom: 0.6rem; }
    .finale-msg {
      font-size: clamp(1.15rem, 3.2vw, 1.6rem);
      font-style: italic;
      line-height: 1.5;
      max-width: 24em;
      margin: 0 auto;
    }
    .finale-msg strong { color: var(--gold); font-style: normal; }

    @media (max-width: 460px) {
      .countdown { grid-template-columns: repeat(2, 1fr); max-width: 320px; }
    }
  </style>
</head>
<body>
  <main id="stage">
    <p class="kicker">For David</p>
    <h1>One Final Curtain <span class="slipper" aria-hidden="true">🩰</span></h1>
    <div class="rule"></div>

    <section class="countdown" id="countdown" aria-live="polite">
      <div class="unit"><div class="num" id="days">--</div><div class="label">Days</div></div>
      <div class="unit"><div class="num" id="hours">--</div><div class="label">Hours</div></div>
      <div class="unit"><div class="num" id="minutes">--</div><div class="label">Minutes</div></div>
      <div class="unit"><div class="num" id="seconds">--</div><div class="label">Seconds</div></div>
    </section>

    <p class="closing">
      <span class="small">Freedom, stage left &middot; December 26, 2026 &middot; 12:00&nbsp;AM CST</span>
    </p>
  </main>

  <script>
    // Target: midnight Central (CST, UTC-6) on Dec 26, 2026 — after the Nutcracker run.
    var TARGET = new Date('2026-12-26T00:00:00-06:00').getTime();

    var els = {
      days:    document.getElementById('days'),
      hours:   document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };

    function pad(n) { return (n < 10 ? '0' : '') + n; }

    var timer = setInterval(tick, 1000);

    function tick() {
      var diff = TARGET - Date.now();

      if (diff <= 0) {
        clearInterval(timer);
        finale();
        return;
      }

      var totalSeconds = Math.floor(diff / 1000);
      var days    = Math.floor(totalSeconds / 86400);
      var hours   = Math.floor((totalSeconds % 86400) / 3600);
      var minutes = Math.floor((totalSeconds % 3600) / 60);
      var seconds = totalSeconds % 60;

      els.days.textContent    = days;
      els.hours.textContent   = pad(hours);
      els.minutes.textContent = pad(minutes);
      els.seconds.textContent = pad(seconds);
    }

    function finale() {
      var stage = document.getElementById('stage');
      stage.className = 'finale';
      stage.innerHTML =
        '<p class="kicker">For David</p>' +
        '<h1>Bravo <span class="slipper" aria-hidden="true">🩰</span></h1>' +
        '<div class="rule"></div>' +
        '<p class="finale-msg">The curtain falls, the house lights come up, and the' +
        ' rest of your life is officially unscheduled. <strong>Take your bow, David.</strong>' +
        ' Now go write.</p>';
    }

    tick();
  </script>
<!-- Sea Monkey back-link to courtneycrappell.com -->
<style>
  .easter-egg { position: fixed; bottom: 10px; right: 10px; z-index: 9999; display: block; line-height: 0; border-radius: 50%; overflow: hidden; }
  .easter-egg img { width: 38px; height: 38px; object-fit: cover; border-radius: 50%; display: block; }
  @media print { .easter-egg { display: none !important; } }
</style>
<a href="https://courtneycrappell.com" class="easter-egg" title="monkey time?">
  <img src="seaMonkeys.png" alt="monkey time?">
</a>

</body>
</html>
